services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: traffic-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_init:/docker-entrypoint-initdb.d
      - ./clickhouse_users/airflow-user.xml:/etc/clickhouse-server/users.d/airflow-user.xml
    networks:
      - traffic-net

  spark-master:
    image: apache/spark:3.5.1
    container_name: traffic-spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - traffic-net

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: traffic-spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
      --cores 1
      --memory 1G
    depends_on:
      - spark-master
    networks:
      - traffic-net

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: traffic-spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8082
      --cores 1
      --memory 1G
    depends_on:
      - spark-master
    networks:
      - traffic-net

  spark-worker-3:
    image: apache/spark:3.5.1
    container_name: traffic-spark-worker-3
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8083
      --cores 1
      --memory 1G
    depends_on:
      - spark-master
    networks:
      - traffic-net

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: traffic-airflow
    depends_on:
      - clickhouse
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "
      airflow db init || true;
      airflow db migrate || true;
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true;
      airflow webserver & airflow scheduler
      "
    networks:
      - traffic-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: traffic-grafana
    depends_on:
      - clickhouse
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - traffic-net

volumes:
  clickhouse_data:
  airflow_logs:
  grafana_data:

networks:
  traffic-net:
    driver: bridge